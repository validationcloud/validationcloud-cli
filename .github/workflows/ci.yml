name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # release.yml calls this workflow on every push to main, so main is checked there and not by a trigger of its own.
  workflow_call:

# No token by default; the job grants only what it needs.
permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Strip untrusted project install config
        # pull_request checks out attacker-controlled code: a committed .npmrc can redirect installs or leak registry credentials, and pnpm runs .pnpmfile.cjs/.pnpmfile.mjs hooks even under --ignore-scripts.
        run: rm -f .npmrc .pnpmfile.cjs .pnpmfile.mjs

      - name: Set up the toolchain
        uses: ./.github/actions/install-workspace

      # --ignore-scripts keeps dependency lifecycle scripts, and our own `prepare` hook installer, from running in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Knip
        run: pnpm run knip

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check complexity (FTA)
        run: pnpm run fta

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # engines.node starts at 22.12.0; this job keeps that claim true. The other gates run once, on the default version (fta-check itself needs Node 24.15 or newer).
  node-minimum:
    name: Node 22.12.0 build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Strip untrusted project install config
        # Same as in the checks job: pull_request checks out attacker-controlled code.
        run: rm -f .npmrc .pnpmfile.cjs .pnpmfile.mjs

      - name: Set up the toolchain
        uses: ./.github/actions/install-workspace
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # The installer ships valcloud.mjs on the Node.js version pinned in scripts/node-runtime.json, so the CLI suite also runs against that bundle on that runtime. That version retries a proxy that closes CONNECT forever (nodejs/undici#3897), which the proxy tests cover.
  bundle:
    name: Bundle tests on the pinned Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Strip untrusted project install config
        # Same as in the checks job: pull_request checks out attacker-controlled code.
        run: rm -f .npmrc .pnpmfile.cjs .pnpmfile.mjs

      - name: Read the pinned Node.js version
        id: pinned
        run: echo "version=$(jq -r .version scripts/node-runtime.json)" >> "$GITHUB_OUTPUT"

      - name: Set up the toolchain
        uses: ./.github/actions/install-workspace
        with:
          node-version: ${{ steps.pinned.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test the bundle
        run: pnpm run test:bundle

  # Installs with the rendered install.sh from local files, with no Node.js on PATH, on each platform family: Linux x64 and arm64, and macOS.
  installer:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Strip untrusted project install config
        # Same as in the checks job: pull_request checks out attacker-controlled code.
        run: rm -f .npmrc .pnpmfile.cjs .pnpmfile.mjs

      - name: Set up the toolchain
        uses: ./.github/actions/install-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint the installer
        if: runner.os == 'Linux'
        run: pnpm run lint:shell

      # The installer runs under /bin/bash, which is Bash 3.2 on macOS.
      - name: Test the installer
        run: pnpm run test:installer

      - name: Test the installer in containers
        if: runner.os == 'Linux'
        run: pnpm run test:installer:docker
