name: Set up the toolchain
description: Node.js from .node-version and the pinned pnpm with a warm store cache. The caller runs the install.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    - name: Set up the pinned pnpm
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        # The version comes from the root `packageManager` field.
        install: false
        cache: true
        require-lockfile: true
